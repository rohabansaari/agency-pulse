name: Desktop agent

# Builds AgencyPulseAgent.exe on Windows and commits the zip served at
# /downloads/AgencyPulseAgent.zip back to the branch. Runs on branch pushes that
# change the agent, so the rebuilt zip ships with the PR that changed it.
on:
  push:
    branches-ignore: [main]
    paths:
      - "desktop-agent/**"
      - ".github/workflows/desktop-agent.yml"
  workflow_dispatch:

concurrency:
  group: desktop-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build agent zip
        shell: pwsh
        run: ./desktop-agent/build.ps1

      - name: Commit rebuilt zip
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/downloads/AgencyPulseAgent.zip
          if git diff --cached --quiet; then
            echo "Zip unchanged."
            exit 0
          fi
          git commit -m "Rebuild desktop agent zip (${GITHUB_SHA::7})"
          git push origin "HEAD:${GITHUB_REF_NAME}"
