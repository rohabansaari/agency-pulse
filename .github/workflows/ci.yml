name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agencypulse_test
          POSTGRES_USER: agencypulse
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U agencypulse -d agencypulse_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_pgsql, redis
          coverage: none
      - name: Install backend dependencies
        working-directory: backend
        run: |
          composer update league/flysystem-aws-s3-v3 --with-all-dependencies --no-interaction --prefer-dist --no-scripts
          composer install --no-interaction --prefer-dist
      - name: Prepare environment
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Validate Laravel boot
        working-directory: backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: agencypulse_test
          DB_USERNAME: agencypulse
          DB_PASSWORD: secret
          DB_SCHEMA: public
          DB_SSLMODE: prefer
        run: |
          php artisan optimize:clear --no-interaction
          php artisan route:list --no-ansi
          php artisan migrate --force --no-interaction
          php artisan migrate:status --no-ansi
      - name: Run backend tests
        working-directory: backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: agencypulse_test
          DB_USERNAME: agencypulse
          DB_PASSWORD: secret
          DB_SCHEMA: public
          DB_SSLMODE: prefer
          REDIS_HOST: 127.0.0.1
        run: php artisan test tests/Feature

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
